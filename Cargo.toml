[package]
name = "sql_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36.2"
keyring = "4.2.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
