[package]
name = "sql_manager"
version = "0.1.0"
edition = "2024"
description = "Lightweight native SQL client, starting with PostgreSQL"
repository = "https://github.com/lucaswilliameufrasio/sql-manager"

[package.metadata.bundle]
name = "SQL Manager"
identifier = "com.lucaswilliameufrasio.sqlmanager"
category = "Developer Tool"
short_description = "Lightweight native SQL client"
long_description = "A lightweight native SQL client with PostgreSQL support, written in Rust and egui."
appimage_metainfo_path = "packaging/com.lucaswilliameufrasio.sqlmanager.appdata.xml"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"

[package.metadata.bundle.linux]
use_terminal = false

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36.2"
futures-util = "0.3.34"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
keyring = "4.2.0"
rfd = "0.17.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
